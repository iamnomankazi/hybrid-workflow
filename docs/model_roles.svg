<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760"><rect x="0" y="0" width="1700" height="760" rx="0" fill="#f8fafc" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1700" height="10" rx="0" fill="#2563eb" stroke="none" stroke-width="2"/><text x="80" y="94" fill="#0f172a" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" text-anchor="start">Models and responsibilities</text><text x="80" y="143" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Opus chooses the workers. Limits are ceilings, never targets.</text><rect x="80" y="195" width="750" height="470" rx="22" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/><rect x="870" y="195" width="750" height="470" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/><rect x="80" y="195" width="750" height="73" rx="20" fill="#ede9fe" stroke="none" stroke-width="2"/><rect x="870" y="195" width="750" height="73" rx="20" fill="#dbeafe" stroke="none" stroke-width="2"/><text x="114" y="242" fill="#6d28d9" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">CLAUDE PRO</text><text x="904" y="242" fill="#1d4ed8" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">CHATGPT PLUS / CODEX</text><rect x="112" y="301" width="684" height="122" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/><text x="142" y="347" fill="#4c1d95" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">Opus 5.5</text><text x="142" y="383" fill="#5b5670" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Primary controller: plans, reviews, integrates</text><rect x="112" y="447" width="328" height="165" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/><rect x="460" y="447" width="336" height="165" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/><text x="136" y="497" fill="#4c1d95" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Haiku 5.5</text><text x="136" y="534" fill="#6d28d9" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Up to 2</text><text x="136" y="565" fill="#475569" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Research and scanning</text><text x="483" y="497" fill="#4c1d95" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Sonnet 5.5</text><text x="483" y="534" fill="#6d28d9" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Up to 2</text><text x="483" y="565" fill="#475569" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Difficult reviews</text><rect x="902" y="301" width="336" height="233" rx="14" fill="#f8fafc" stroke="#bfdbfe" stroke-width="2"/><rect x="1258" y="301" width="328" height="233" rx="14" fill="#f8fafc" stroke="#bfdbfe" stroke-width="2"/><text x="927" y="349" fill="#1d4ed8" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Luna XHigh</text><text x="927" y="387" fill="#182236" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Implementation</text><text x="927" y="421" fill="#182236" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Exploration</text><text x="927" y="494" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Shared pool: 4 default</text><text x="1283" y="349" fill="#1d4ed8" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Sol High / XHigh</text><text x="1283" y="387" fill="#182236" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Reasoning and coding</text><text x="1283" y="421" fill="#182236" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Independent review</text><text x="1283" y="494" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Up to 8 workers total</text><rect x="902" y="554" width="684" height="79" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="927" y="588" fill="#1d4ed8" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="start">Temporary Sol XHigh controller</text><text x="927" y="617" fill="#475569" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Only when Opus hands off the run</text><text x="80" y="716" fill="#475569" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start">Human approval remains required before anything reaches main.</text></svg>